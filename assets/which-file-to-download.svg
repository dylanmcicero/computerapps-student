<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="title desc">
<title id="title">How to choose the correct Computer Applications download</title>
<desc id="desc">Example GitHub release page. Under Assets, choose ComputerApplications-Windows-x64.zip, not Source code zip.</desc>
<rect width="900" height="465" rx="16" fill="#f6f8fa"/>
<text x="30" y="42" fill="#24292f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Example: what to download on GitHub Releases</text>
<text x="30" y="69" fill="#57606a" font-family="Arial, sans-serif" font-size="15">Illustration — the actual release will appear after publication</text>
<rect x="30" y="90" width="840" height="345" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="54" y="113" width="790" height="54" rx="8" fill="#f6f8fa"/>
<text x="74" y="146" fill="#24292f" font-family="Arial, sans-serif" font-size="23" font-weight="700">Computer Applications — Windows</text>
<rect x="54" y="189" width="790" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="75" y="221" fill="#24292f" font-family="Arial, sans-serif" font-size="20" font-weight="700">Assets</text>
<text x="155" y="221" fill="#57606a" font-family="Arial, sans-serif" font-size="18">3</text>
<rect x="55" y="251" width="788" height="58" rx="8" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
<circle cx="82" cy="280" r="12" fill="#1a7f37"/>
<path d="M75 280l5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="107" y="286" fill="#116329" font-family="Arial, sans-serif" font-size="19" font-weight="700">ComputerApplications-Windows-x64.zip</text>
<text x="752" y="286" fill="#116329" font-family="Arial, sans-serif" font-size="15" font-weight="700">GET THIS</text>
<line x1="55" y1="323" x2="843" y2="323" stroke="#d0d7de"/>
<text x="107" y="348" fill="#57606a" font-family="Arial, sans-serif" font-size="17">SHA256SUMS.txt (optional verification)</text>
<line x1="55" y1="365" x2="843" y2="365" stroke="#d0d7de"/>
<circle cx="82" cy="391" r="12" fill="#cf222e"/>
<path d="M77 386l10 10M87 386l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="107" y="397" fill="#8250df" font-family="Arial, sans-serif" font-size="19">Source code (zip)</text>
<text x="659" y="397" fill="#cf222e" font-family="Arial, sans-serif" font-size="15" font-weight="700">NOT FOR STUDENTS</text>
</svg>